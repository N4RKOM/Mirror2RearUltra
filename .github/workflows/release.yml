name: Release

# Push a tag such as v1.29.2 to build a signed release APK and publish it on the Releases page.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Find the branch the tag was cut from
        id: branch
        run: |
          BRANCH=$(git branch -r --contains "$GITHUB_SHA" | grep -v HEAD | sed 's#.*origin/##' | head -1)
          echo "name=${BRANCH:-${{ github.event.repository.default_branch }}}" >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is not set; a release APK cannot be signed."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Build signed Rear Unlock module APK
        working-directory: rearunlock
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Name the APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/Mirror2RearUltra-${GITHUB_REF_NAME}.apk"
          cp rearunlock/app/build/outputs/apk/release/*.apk "dist/Mirror2RearUltra-RearUnlock-module.apk"

      - name: Write release notes from the commits since the previous tag
        run: |
          PREV=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_SHA^" 2>/dev/null || true)
          RANGE="${PREV:+$PREV..}$GITHUB_SHA"
          git log --no-merges --pretty='- %s' "$RANGE" | head -50 > release-notes.md
          if [ -n "$PREV" ]; then
            printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
              "$GITHUB_REPOSITORY" "$PREV" "$GITHUB_REF_NAME" >> release-notes.md
          fi

      - name: Publish to Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          target_commitish: ${{ steps.branch.outputs.name }}
          body_path: release-notes.md

      - name: Keep the APKs as a build artifact (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: dist/*.apk
