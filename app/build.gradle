plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.tpkarras.mirror2rearultra'
    compileSdk { version = release(37) }

    defaultConfig {
        applicationId "com.tpkarras.mirror2rearultra"
        minSdk 30
        targetSdk 36
        versionCode 43
        versionName "1.30.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // Release signing comes from the environment (CI) or gradle properties, never from the repository.
    def signingStoreFile = System.getenv('KEYSTORE_FILE') ?: project.findProperty('keystoreFile')
    if (signingStoreFile) {
        signingConfigs {
            release {
                storeFile file(signingStoreFile)
                storePassword System.getenv('KEYSTORE_PASSWORD') ?: project.findProperty('keystorePassword')
                keyAlias System.getenv('KEY_ALIAS') ?: project.findProperty('keyAlias')
                keyPassword System.getenv('KEY_PASSWORD') ?: project.findProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            if (signingStoreFile) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { compose true }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'top.yukonga.miuix.kmp:miuix-ui:0.9.4'
    implementation 'top.yukonga.miuix.kmp:miuix-preference:0.9.4'
    implementation 'com.github.ChickenHook:RestrictionBypass:2.2'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.17.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'com.google.zxing:core:3.5.3'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
